name: Deploy to Zeabur

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy-zeabur
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Zeabur
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          npx -y zeabur@latest auth login --token "$ZEABUR_TOKEN"
          npx -y zeabur@latest deploy \
            --service-id 6a21c113f1be9943f1f8e80f \
            --environment-id 6a21c0fe95b39806d284a6ac \
            -i=false
