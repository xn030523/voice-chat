name: Zeabur Info
on: workflow_dispatch

jobs:
  info:
    runs-on: ubuntu-latest
    steps:
      - name: Query domains & deployments
        env:
          ZEABUR_TOKEN: ${{ secrets.ZEABUR_TOKEN }}
        run: |
          npx -y zeabur@latest auth login --token "$ZEABUR_TOKEN"
          echo "=== DOMAINS ==="
          npx -y zeabur@latest domain list --id 6a21c113f1be9943f1f8e80f --env-id 6a21c0fe95b39806d284a6ac -i=false 2>&1 || true
          echo "=== DEPLOYMENTS ==="
          npx -y zeabur@latest deployment list --id 6a21c113f1be9943f1f8e80f --env-id 6a21c0fe95b39806d284a6ac -i=false 2>&1 || true
